name: Deploy a cPanel (FTP)

# Despliega automáticamente el sitio (SPA estático) a tu hosting cPanel en cada
# push a main. Requiere 3 secretos en el repo (Settings → Secrets → Actions):
#   FTP_SERVER    -> host FTP de tu cPanel (ej. ftp.yescomputo.com o la IP)
#   FTP_USERNAME  -> usuario FTP
#   FTP_PASSWORD  -> contraseña FTP
# Mientras no estén configurados, el job se salta solo (no falla).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ¿FTP configurado?
        id: gate
        run: |
          if [ -n "${{ secrets.FTP_SERVER }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP_SERVER no configurado — se omite el despliegue a cPanel."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Compilar (SPA estático)
        if: steps.gate.outputs.ready == 'true'
        run: npm run build:static

      - name: Crear .htaccess (fallback SPA para Apache/cPanel)
        if: steps.gate.outputs.ready == 'true'
        run: |
          cat > dist/yescomputo/browser/.htaccess <<'HT'
          # Caché: el HTML SIEMPRE se revalida (si no, el navegador guarda un
          # index.html viejo que apunta a JS/CSS ya borrados → página en blanco).
          # Los archivos con hash en el nombre son inmutables → caché de 1 año.
          <IfModule mod_headers.c>
            <FilesMatch "\.(html|php)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
              Header set Pragma "no-cache"
              Header unset Last-Modified
              Header unset ETag
            </FilesMatch>
            <FilesMatch "-[A-Z0-9]{8}\.(js|css)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          FileETag None
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            # Tarjeta digital: los robots de redes reciben la vista previa (Open Graph)
            RewriteCond %{HTTP_USER_AGENT} (facebookexternalhit|facebot|whatsapp|twitterbot|linkedinbot|slackbot|telegrambot|discordbot|pinterest|skypeuripreview|applebot|googlebot|bingbot|embedly|iframely) [NC]
            RewriteRule ^tarjeta/([a-z0-9-]+)/?$ /tarjeta-og.php?c=$1 [L,QSA]
            # Un JS/CSS/imagen que no existe da 404 real (no el index.html, que
            # el navegador intentaría ejecutar como script).
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_URI} !\.(js|css|map|png|jpe?g|webp|svg|ico|woff2?)$ [NC]
            RewriteRule . /index.html [L]
          </IfModule>
          HT

      # El cPanel a veces corta la conexión FTP ("AggregateError: (control socket)").
      # Se reintenta hasta 3 veces con pausa; solo falla el despliegue si fallan las 3.
      - name: Subir a cPanel por FTP
        id: ftp1
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # El servidor exige TLS (rechaza FTP en texto plano) → FTP sobre TLS explícito.
          protocol: ftps
          port: 21
          local-dir: ./dist/yescomputo/browser/
          # La cuenta FTP debe estar limitada a la carpeta public_html (ver pasos),
          # así el raíz FTP ya ES public_html y subimos a "./".
          server-dir: ./
      - name: Esperar antes de reintentar
        if: steps.gate.outputs.ready == 'true' && steps.ftp1.outcome == 'failure'
        run: sleep 45
      - name: Subir a cPanel por FTP (2º intento)
        id: ftp2
        if: steps.gate.outputs.ready == 'true' && steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # El servidor exige TLS (rechaza FTP en texto plano) → FTP sobre TLS explícito.
          protocol: ftps
          port: 21
          local-dir: ./dist/yescomputo/browser/
          # La cuenta FTP debe estar limitada a la carpeta public_html (ver pasos),
          # así el raíz FTP ya ES public_html y subimos a "./".
          server-dir: ./
      - name: Esperar antes del último intento
        if: steps.gate.outputs.ready == 'true' && steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 90
      - name: Subir a cPanel por FTP (3er intento)
        if: steps.gate.outputs.ready == 'true' && steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # El servidor exige TLS (rechaza FTP en texto plano) → FTP sobre TLS explícito.
          protocol: ftps
          port: 21
          local-dir: ./dist/yescomputo/browser/
          # La cuenta FTP debe estar limitada a la carpeta public_html (ver pasos),
          # así el raíz FTP ya ES public_html y subimos a "./".
          server-dir: ./
