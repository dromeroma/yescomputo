# Cloudflare Worker que sirve la SPA de Angular (estáticos + fallback a index.html).
# El fallback lo hace worker.js explícitamente, para no depender de opciones que
# no siempre se aplican en workers de solo-assets.
name = "yescomputo"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist/yescomputo/browser"
binding = "ASSETS"
