# Cloudflare Worker que sirve la SPA de Angular (estáticos + fallback a index.html).
# html_handling = "none": sin magia de .html, para que /index.html se pueda servir
# directamente (el Worker lo usa como fallback de las rutas del cliente).
name = "yescomputo"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist/yescomputo/browser"
binding = "ASSETS"
html_handling = "none"
