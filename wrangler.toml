# Configuración de Cloudflare (Workers static assets) para servir la SPA.
# `single-page-application` = cualquier ruta no encontrada sirve index.html con
# estado 200, para que Angular enrute en el cliente (sin bucles de _redirects).
name = "yescomputo"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist/yescomputo/browser"
not_found_handling = "single-page-application"
