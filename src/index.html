<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <title>Yes Computo · Tecnología Circular para empresas</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary meta -->
    <meta
      name="description"
      content="Yes Computo · 20 años liderando la Tecnología Circular en Cartagena. Equipos corporativos, portátiles, workstations, alquiler de tecnología y servicio técnico especializado para empresas."
    />
    <meta name="theme-color" content="#0f1c32" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph (defaults; per-route values are set by SeoService) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yes Computo" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://www.yescomputo.com/" />
    <meta property="og:title" content="Yes Computo · Esta Navidad, regala tecnología" />
    <meta
      property="og:description"
      content="Portátiles, monitores y accesorios con garantía para regalar esta Navidad. Tecnología que evoluciona, confianza que permanece — Cartagena."
    />
    <!-- Temporada: imagen navideña. Al terminar Navidad volver a /img/og-cover.png (image/png) aquí y en SeoService. -->
    <meta property="og:image" content="https://www.yescomputo.com/img/og-navidad.jpg" />
    <meta property="og:image:secure_url" content="https://www.yescomputo.com/img/og-navidad.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yes Computo · Esta Navidad, regala tecnología." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yes Computo · Esta Navidad, regala tecnología" />
    <meta
      name="twitter:description"
      content="Portátiles, monitores y accesorios con garantía para regalar esta Navidad. Tecnología que evoluciona, confianza que permanece — Cartagena."
    />
    <meta name="twitter:image" content="https://www.yescomputo.com/img/og-navidad.jpg" />
    <meta name="twitter:image:alt" content="Yes Computo · Esta Navidad, regala tecnología." />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="img/logo-mark.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Fonts: Sora (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Apply saved theme + seasonal campaign before first paint (no flash). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('yc.theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
          // Keep in sync with SEASONAL_CAMPAIGNS in campaigns.ts ([] = off).
          // Same rule as CampaignService: an explicit 'on' wins, else the
          // first in-season campaign is on unless the user turned it off.
          var seasons = ['navidad'];
          var active = null;
          for (var i = 0; i < seasons.length; i++) {
            if (localStorage.getItem('yc.campaign.' + seasons[i]) === 'on') { active = seasons[i]; break; }
          }
          if (!active && seasons.length && localStorage.getItem('yc.campaign.' + seasons[0]) !== 'off') {
            active = seasons[0];
          }
          if (active) document.documentElement.setAttribute('data-campaign', active);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
